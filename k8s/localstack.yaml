# LocalStack inside the kind cluster, namespace `airflow`, service name
# `localstack` — so the SAME dag files work as in compose (host `localstack`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init
  namespace: airflow
data:
  init-queue.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    awslocal sqs create-queue --queue-name demo-events
    awslocal sqs create-queue --queue-name lab-events
    awslocal sqs create-queue --queue-name doorbell-events
    awslocal s3 mb s3://roman-incoming
    awslocal s3api put-bucket-notification-configuration \
      --bucket roman-incoming \
      --notification-configuration '{
        "QueueConfigurations": [{
          "QueueArn": "arn:aws:sqs:us-east-1:000000000000:doorbell-events",
          "Events": ["s3:ObjectCreated:*"]
        }]
      }'
    echo "LocalStack lab resources ready."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: airflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: localstack }
  template:
    metadata:
      labels: { app: localstack }
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          env:
            - name: SERVICES
              value: sqs,s3
          ports:
            - containerPort: 4566
          volumeMounts:
            - name: init
              mountPath: /etc/localstack/init/ready.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "awslocal sqs list-queues | grep doorbell-events"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: init
          configMap:
            name: localstack-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: airflow
spec:
  selector: { app: localstack }
  ports:
    - port: 4566
      targetPort: 4566
